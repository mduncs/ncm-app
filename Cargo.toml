[workspace]
members = [
    "crates/ncm-model",
    "crates/ncm-tmux",
    "crates/ncm-term",
    "crates/ncm-render",
    "crates/ncm-talk",
    "crates/ncm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
crossterm = "0.29"
vte = "0.15"
unicode-width = "0.2"
fontdue = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
memchr = "2.8"
ncm-model = { path = "crates/ncm-model" }
ncm-tmux = { path = "crates/ncm-tmux" }
ncm-term = { path = "crates/ncm-term" }
ncm-render = { path = "crates/ncm-render" }
ncm-talk = { path = "crates/ncm-talk" }

[profile.dev]
debug = 1
